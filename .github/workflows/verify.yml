name: Vérifications avant fusion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application et PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:cloud
        env:
          VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      - run: npx playwright install --with-deps chrome
      - run: npm run test:ui:browser
      - run: npm run test:pwa:browser
        env:
          VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
