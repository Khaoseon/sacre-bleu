name: Vérifications avant fusion

on:
  pull_request:
    branches: [main, release/v1.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application et PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:7a
      - run: npm run format:check
      - run: npm run notices:check
      - run: npm run build
      - run: npm run build:7a
      - run: npm run build:cloud
        env:
          VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      - run: npx playwright install --with-deps chrome
      - run: npm run test:7a:browser
      - run: npm run test:ui:browser
      - run: npm run test:i18n:browser
      - run: node scripts/browser/shop-scanner.integration.mjs
      - run: npm run test:off:browser
      - run: npm run test:pwa:browser
        env:
          VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture

  backend:
    name: Restauration, sécurité et hors ligne
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Exercise the actual historical installed client sources.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx supabase start > /dev/null
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run db:lint
      - run: npm run db:types
      - run: git diff --exit-code -- src/backend/database.generated.ts
      - run: npm run test:db:concurrency
      - run: npm run test:db:api
      - run: npm run test:shared
      - run: npm run test:backup
      - run: npm run env:local
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:phase5:browser
      - run: npm run test:scanners:browser
      - if: always()
        run: npx supabase stop --no-backup
